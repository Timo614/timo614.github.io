<!-- Retro Terminal Styling -->
<style>
/* Terminal cursor effect */
.terminal-cursor::after {
  content: '█';
  color: var(--terminal-yellow);
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}



/* Matrix-style background effect */
.matrix-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -10;
  opacity: 0.15;
}
</style>
